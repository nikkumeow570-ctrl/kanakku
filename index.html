<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanakku — Income &amp; Expense Manager</title>
<meta name="theme-color" content="#1b7a5e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --text:#1c1c1c; --sub:#6b6b6b;
  --line:#e7e5df; --income:#1b7a5e; --expense:#b3452c; --accent:#1b7a5e;
  --accent-ink:#ffffff; --chip:#f0efe9; --gold:#c98a1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141519; --card:#1e1f24; --text:#f1f0ec; --sub:#9a9a9a;
    --line:#2c2d32; --chip:#26272c; --accent-ink:#0d0d0d;
  }
}
:root[data-theme="dark"]{
  --bg:#141519; --card:#1e1f24; --text:#f1f0ec; --sub:#9a9a9a;
  --line:#2c2d32; --chip:#26272c; --accent-ink:#0d0d0d;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  max-width:480px; margin-inline:auto; padding:14px 14px 90px;
}
header{
  position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg);
  padding:10px 2px 10px; z-index:5; display:flex; justify-content:space-between; align-items:center;
}
.brand{display:flex; align-items:center; gap:8px}
.brand svg{width:34px; height:34px; border-radius:9px; flex-shrink:0}
h1{font-size:1.2rem; margin:0; letter-spacing:.2px}
.hdrbtns{display:flex; gap:6px}
.themebtn{border:1px solid var(--line); background:var(--card); color:var(--text); width:34px; height:34px; border-radius:10px; font-size:.85rem; font-weight:700}
.monthbar{display:flex; align-items:center; justify-content:space-between; margin:4px 2px 12px}
.monthbar button{background:var(--chip); border:none; color:var(--text); width:30px; height:30px; border-radius:8px; font-size:1rem}
.monthbar .mlabel{font-weight:700; font-size:.95rem}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px}
.stat .label{font-size:.7rem; color:var(--sub); text-transform:uppercase; letter-spacing:.5px}
.stat .val{font-size:1.25rem; font-weight:700; margin-top:4px}
.balance{grid-column:1/3; text-align:center}
.balance .val{font-size:1.7rem}
.income .val{color:var(--income)}
.expense .val{color:var(--expense)}
.tabs{display:flex; gap:5px; margin:6px 0 10px; background:var(--chip); padding:4px; border-radius:12px; overflow-x:auto}
.tab{flex:1; text-align:center; padding:8px 4px; border-radius:9px; font-size:.76rem; color:var(--sub); cursor:pointer; white-space:nowrap}
.tab.active{background:var(--card); color:var(--text); font-weight:600}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px}
label{font-size:.78rem; color:var(--sub); display:block; margin:10px 0 4px}
input,select{
  width:100%; padding:11px; border-radius:10px; border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-size:.95rem;
}
.seg{display:flex; gap:8px; margin-top:4px}
.seg button{flex:1; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--sub); font-weight:600; font-size:.85rem}
.seg button.on.in{background:var(--income); color:#fff; border-color:var(--income)}
.seg button.on.ex{background:var(--expense); color:#fff; border-color:var(--expense)}
.submit{margin-top:14px; width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:.95rem}
.ghost{margin-top:8px; width:100%; padding:11px; border:1px solid var(--line); border-radius:12px; background:transparent; color:var(--sub); font-weight:600; font-size:.85rem}
.searchrow{display:flex; gap:8px; margin-bottom:10px}
.searchrow input{flex:2} .searchrow select{flex:1}
.entry{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:none}
.dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
.dot.in{background:var(--income)} .dot.ex{background:var(--expense)}
.entry .meta{flex:1; min-width:0}
.entry .cat{font-weight:600; font-size:.9rem}
.entry .note{color:var(--sub); font-size:.75rem; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.entry .amt{font-weight:700; font-size:.9rem; white-space:nowrap}
.entry .amt.in{color:var(--income)} .entry .amt.ex{color:var(--expense)}
.entry .acts{display:flex; gap:6px}
.entry .acts span{color:var(--sub); font-size:1rem; padding:4px; opacity:.7}
.empty{text-align:center; color:var(--sub); padding:30px 10px; font-size:.85rem}
.section-title{font-size:.75rem; color:var(--sub); text-transform:uppercase; letter-spacing:.4px; margin:16px 2px 8px}
.donutwrap{display:flex; align-items:center; gap:16px}
.legend{flex:1; font-size:.78rem}
.legend div{display:flex; align-items:center; gap:6px; margin:4px 0}
.legend i{width:9px; height:9px; border-radius:50%; display:inline-block}
.budgetrow{margin-bottom:14px}
.budgetrow .top{display:flex; justify-content:space-between; font-size:.85rem; margin-bottom:4px}
.budgetrow .bar{height:8px; background:var(--chip); border-radius:5px; overflow:hidden}
.budgetrow .bar i{display:block; height:100%; border-radius:5px}
.over{color:var(--expense) !important}
.filerow{display:flex; gap:8px}
.filerow button{flex:1}
.toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;gap:14px;align-items:center;font-size:.85rem;z-index:20}.toast button{background:none;border:none;color:var(--gold);font-weight:700}
#nudge{font-size:.82rem;color:var(--gold);border-color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#1b7a5e"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#c98a1f" stroke-width="3"/>
      <text x="50" y="68" font-size="52" text-anchor="middle" fill="#ffffff" font-family="Noto Sans Tamil, Latha, serif">க</text>
    </svg>
    <h1>Kanakku</h1>
  </div>
  <div class="hdrbtns">
    <button class="themebtn" id="langToggle">EN</button>
    <button class="themebtn" id="themeToggle">🌓</button>
  </div>
</header>

<div class="monthbar">
  <button id="prevM">‹</button>
  <div class="mlabel" id="mLabel">—</div>
  <button id="nextM">›</button>
</div>

<div class="cards">
  <div class="stat balance"><div class="label" data-i="statBalance">Balance</div><div class="val" id="balVal">₹0</div></div>
  <div class="stat income"><div class="label" data-i="statIncome">Income</div><div class="val" id="inVal">₹0</div></div>
  <div class="stat expense"><div class="label" data-i="statExpense">Expense</div><div class="val" id="exVal">₹0</div></div>
</div>

<div class="tabs">
  <div class="tab active" data-t="dash" data-i="tabDash">Dashboard</div>
  <div class="tab" data-t="add" data-i="tabAdd">Add</div>
  <div class="tab" data-t="history" data-i="tabHistory">History</div>
  <div class="tab" data-t="ledger" data-i="tabLedger">Udhaar</div>
  <div class="tab" data-t="budgets" data-i="tabBudgets">Budgets</div>
  <div class="tab" data-t="data" data-i="tabData">Data</div>
</div>

<div class="card" id="nudge" style="display:none;cursor:pointer"></div>
<div class="panel active" id="p-dash">
  <div class="section-title" data-i="sectionBreakdown">Expense breakdown</div>
  <div class="card">
    <div class="donutwrap">
      <svg id="donut" width="120" height="120" viewBox="0 0 120 120"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>
  <div class="section-title" data-i="sectionRecent">Recent</div>
  <div class="card" id="recentList"></div>
</div>

<div class="panel" id="p-add">
  <div class="card">
    <div class="seg">
      <button type="button" id="btnIn" class="on in" data-i="segIncome">Income</button>
      <button type="button" id="btnEx" class="ex" data-i="segExpense">Expense</button>
    </div>
    <label data-i="lblAmount">Amount (₹)</label>
    <input type="number" id="amount" inputmode="decimal" placeholder="0">
    <label data-i="lblCategory">Category</label>
    <select id="category"></select>
    <label data-i="lblNote">Note (optional)</label>
    <input type="text" id="note" data-iph="notePlaceholder" placeholder="e.g. tailoring order, milk, electricity">
    <label data-i="lblDate">Date</label>
    <input type="date" id="date">
    <button class="submit" id="save" data-i="btnSave">Save Entry</button>
    <button class="ghost" id="cancelEdit" data-i="btnCancelEdit" style="display:none">Cancel edit</button>
  </div>
</div>

<div class="panel" id="p-history">
  <div class="searchrow">
    <input type="text" id="search" data-iph="searchPlaceholder" placeholder="Search notes/category">
    <select id="filterType">
      <option value="all" data-i="filterAll">All</option>
      <option value="income" data-i="filterIncome">Income</option>
      <option value="expense" data-i="filterExpense">Expense</option>
    </select>
  </div>
  <div class="card" id="historyList"></div>
</div>

<div class="panel" id="p-ledger">
  <div class="cards"><div class="stat income"><div class="label" data-i="ledGet">You'll get</div><div class="val" id="ledGetVal">₹0</div></div><div class="stat expense"><div class="label" data-i="ledOwe">You owe</div><div class="val" id="ledOweVal">₹0</div></div></div>
  <div class="card">
    <div class="seg"><button type="button" id="ledDirGet" class="on in" data-i="ledDirGet">They owe me</button><button type="button" id="ledDirGive" class="ex" data-i="ledDirGive">I owe them</button></div>
    <label data-i="ledPerson">Name</label><input type="text" id="ledName">
    <label data-i="lblAmount">Amount (₹)</label><input type="number" id="ledAmt" inputmode="decimal">
    <label data-i="lblNote">Note (optional)</label><input type="text" id="ledNote">
    <button class="submit" id="ledSave" data-i="btnSave">Save Entry</button>
  </div>
  <div class="card" id="ledList"></div>
</div>

<div class="panel" id="p-budgets">
  <div class="section-title" data-i="sectionBudgets">Monthly budgets by category</div>
  <div class="card" id="budgetsList"></div>
</div>

<div class="panel" id="p-data">
  <div class="card">
    <div class="section-title" data-i="sectionCurrency" style="margin-top:0">Currency symbol</div>
    <input type="text" id="currencySym" maxlength="3" placeholder="₹">
    <div class="section-title" data-i="sectionReminder">Daily reminder</div>
    <div class="seg">
      <button type="button" id="remOn" class="on in" data-i="btnOn">On</button>
      <button type="button" id="remOff" data-i="btnOff">Off</button>
    </div>
    <label data-i="lblRemindAt">Remind me at</label>
    <input type="time" id="remTime" value="20:00">
    <div id="remStatus" style="font-size:.75rem; color:var(--sub); margin-top:8px"></div>
    <div class="section-title" data-i="sectionBackup">Backup</div>
    <div class="filerow">
      <button class="ghost" id="exportCsv" data-i="btnExportCsv">Export CSV</button>
      <button class="ghost" id="exportJson" data-i="btnExportJson">Export JSON</button>
    </div>
    <button class="submit" id="emailBackup" data-i="btnEmailBackup" style="margin-top:8px">Backup to Gmail</button>
    <label data-i="lblImport">Import JSON backup</label>
    <input type="file" id="importFile" accept="application/json">
    <div class="section-title" data-i="sectionDanger">Danger zone</div>
    <button class="ghost" id="clearAll" data-i="btnErase" style="color:var(--expense); border-color:var(--expense)">Erase all data</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script>

};
const CAT_KEYS = {
  income: ["Business Income","Household Allowance","Freelance/Order Payment","Gift/Other Income"],
  expense: ["Groceries","Utilities","Rent","Business Expense","Transport","Health","Education/Children","Savings/Investment","Other"]
};
const CAT_TA = {
  "Business Income":"வணிக வருமானம்", "Household Allowance":"வீட்டு செலவுத் தொகை",
  "Freelance/Order Payment":"ஃப்ரீலான்ஸ்/ஆர்டர் கட்டணம்", "Gift/Other Income":"பரிசு/பிற வருமானம்",
  "Groceries":"மளிகை", "Utilities":"மின்/நீர்/எரிவாயு", "Rent":"வாடகை",
  "Business Expense":"வணிக செலவு", "Transport":"போக்குவரத்து", "Health":"ஆரோக்கியம்",
  "Education/Children":"கல்வி/குழந்தைகள்", "Savings/Investment":"சேமிப்பு/முதலீடு", "Other":"மற்றவை"
};
const PALETTE = ["#b3452c","#c98a1f","#1b7a5e","#3d6fb4","#8a4fb3","#b34f8c","#5a5a5a","#2e9e7a","#c9542a"];
let type = "income", entries = [], editId = null, cur = "₹", lang = "en";
let viewDate = new Date(); viewDate.setDate(1);

function t(key){ const v = STR[lang][key]; return v!==undefined ? v : STR.en[key]; }
function catLabel(key){ return lang==="ta" ? (CAT_TA[key]||key) : key; }

function load(){
  try{ entries = cleanEntries(JSON.parse(localStorage.getItem("kanakku_entries") || "[]")); }catch(e){ entries = []; }
  loadLedger();
  try{ cur = localStorage.getItem("kanakku_currency") || "₹"; }catch(e){}
  try{ lang = localStorage.getItem("kanakku_lang") || "en"; }catch(e){}
  try{ document.documentElement.setAttribute("data-theme", localStorage.getItem("kanakku_theme") || ""); }catch(e){}
}
function persist(){ try{ localStorage.setItem("kanakku_entries", JSON.stringify(entries)); }catch(e){} }
function fmt(n){ return cur + Number(n).toLocaleString("en-IN",{maximumFractionDigits:0}); }
function ym(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function today(){ const d=new Date(); return ym(d)+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(x){ return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function cleanEntries(list){ return list.map((e,i)=>{ const amt=Number(e&&e.amt); if(!e||!(amt>0)||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return null; return {id:Number(e.id)||Date.now()+i,type:e.type==="expense"?"expense":"income",amt,cat:String(e.cat||"Other"),note:String(e.note||""),date:e.date}; }).filter(Boolean); }
function cleanLed(l){ const amt=Number(l&&l.amt), name=String((l&&l.name)||"").slice(0,60); if(!(amt>0)||!name) return null; return {id:Number(l.id)||Date.now(),name,dir:l.dir==="give"?"give":"get",amt,note:String(l.note||""),date:String(l.date||today()),settled:!!l.settled}; }
let ledger=[], ledDir="get", toastTimer;
function loadLedger(){ try{ ledger=JSON.parse(localStorage.getItem("kanakku_ledger")||"[]").map(cleanLed).filter(Boolean); }catch(e){ ledger=[]; } }
function saveLedger(){ try{ localStorage.setItem("kanakku_ledger",JSON.stringify(ledger)); }catch(e){} }
function markBackup(){ try{ localStorage.setItem("kanakku_last_backup",today()); }catch(e){} renderNudge(); }
function renderNudge(){ const el=document.getElementById("nudge"); if(!entries.length&&!ledger.length){ el.style.display="none"; return; } let last=""; try{ last=localStorage.getItem("kanakku_last_backup")||""; }catch(e){} const days=last?Math.round((new Date(today())-new Date(last))/864e5):0; if(last&&days<30){ el.style.display="none"; return; } el.textContent=last?t("nudge")(days):t("nudgeNever"); el.style.display="block"; }
document.getElementById("nudge").onclick=()=>document.querySelector('.tab[data-t="data"]').click();
function showToast(msg,undoFn){ const el=document.getElementById("toast"); el.innerHTML=""; const sp=document.createElement("span"); sp.textContent=msg; el.appendChild(sp); if(undoFn){ const b=document.createElement("button"); b.textContent=t("undo"); b.onclick=()=>{ undoFn(); el.style.display="none"; }; el.appendChild(b); } el.style.display="flex"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ el.style.display="none"; },5000); }
["Get","Give"].forEach(k=>{ document.getElementById("ledDir"+k).onclick=()=>{ ledDir=k.toLowerCase(); document.getElementById("ledDirGet").classList.toggle("on",ledDir==="get"); document.getElementById("ledDirGive").classList.toggle("on",ledDir==="give"); }; });
document.getElementById("ledSave").onclick=()=>{ const name=document.getElementById("ledName").value.trim(), amt=parseFloat(document.getElementById("ledAmt").value); if(!name||!(amt>0)) return; ledger.unshift({id:Date.now(),name,dir:ledDir,amt,note:document.getElementById("ledNote").value.trim(),date:today(),settled:false}); saveLedger(); ["ledName","ledAmt","ledNote"].forEach(i=>document.getElementById(i).value=""); renderLedger(); renderNudge(); };
function renderLedger(){ let get=0,owe=0; ledger.forEach(l=>{ if(!l.settled){ if(l.dir==="get") get+=l.amt; else owe+=l.amt; } }); document.getElementById("ledGetVal").textContent=fmt(get); document.getElementById("ledOweVal").textContent=fmt(owe);
  const box=document.getElementById("ledList"); if(!ledger.length){ box.innerHTML=`<div class="empty">${t("ledEmpty")}</div>`; return; }
  const list=[...ledger].sort((a,b)=>a.settled-b.settled);
  box.innerHTML=list.map(l=>`<div class="entry" style="${l.settled?"opacity:.55":""}"><div class="dot ${l.dir==="get"?"in":"ex"}"></div><div class="meta"><div class="cat" style="${l.settled?"text-decoration:line-through":""}">${esc(l.name)}</div><div class="note">${esc(l.date)}${l.note?" · "+esc(l.note):""}</div></div><div class="amt ${l.dir==="get"?"in":"ex"}">${fmt(l.amt)}</div><div class="acts"><span class="ledok" data-id="${l.id}" title="${t("ledDone")}">✓</span><span class="leddel" data-id="${l.id}">✕</span></div></div>`).join("");
  box.querySelectorAll(".ledok").forEach(b=>b.onclick=()=>{ const l=ledger.find(x=>x.id===Number(b.dataset.id)); if(l){ l.settled=!l.settled; saveLedger(); renderLedger(); renderNudge(); } });
  box.querySelectorAll(".leddel").forEach(b=>b.onclick=()=>{ ledger=ledger.filter(x=>x.id!==Number(b.dataset.id)); saveLedger(); renderLedger(); renderNudge(); }); }
function fillCats(){
  const sel = document.getElementById("category");
  sel.innerHTML = CAT_KEYS[type].map(c=>`<option value="${c}">${catLabel(c)}</option>`).join("");
}
function applyLang(){
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-iph]").forEach(el=>{ el.placeholder = t(el.dataset.iph); });
  document.getElementById("langToggle").textContent = lang==="en" ? "EN" : "த";
  fillCats();
  updateRemStatus();
  renderAll();
}
document.getElementById("langToggle").onclick=()=>{
  lang = lang==="en" ? "ta" : "en";
  try{ localStorage.setItem("kanakku_lang", lang); }catch(e){}
  applyLang();
};

document.getElementById("btnIn").onclick=()=>{type="income"; document.getElementById("btnIn").classList.add("on"); document.getElementById("btnEx").classList.remove("on"); fillCats();};
document.getElementById("btnEx").onclick=()=>{type="expense"; document.getElementById("btnEx").classList.add("on"); document.getElementById("btnIn").classList.remove("on"); fillCats();};

document.querySelectorAll(".tab").forEach(el=>{
  el.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("p-"+el.dataset.t).classList.add("active");
    renderAll();
  };
});

document.getElementById("prevM").onclick=()=>{ viewDate.setMonth(viewDate.getMonth()-1); renderAll(); };
document.getElementById("nextM").onclick=()=>{ viewDate.setMonth(viewDate.getMonth()+1); renderAll(); };

document.getElementById("save").onclick=()=>{
  const amt = parseFloat(document.getElementById("amount").value);
  if(!amt || amt<=0){ document.getElementById("amount").focus(); return; }
  const cat = document.getElementById("category").value;
  const note = document.getElementById("note").value.trim();
  const date = document.getElementById("date").value || today();
  if(editId){
    const idx = entries.findIndex(e=>e.id===editId);
    if(idx>-1) entries[idx] = {...entries[idx], type, amt, cat, note, date};
    editId = null;
    document.getElementById("cancelEdit").style.display="none";
    document.getElementById("save").textContent=t("btnSave");
  } else {
    entries.unshift({id:Date.now(), type, amt, cat, note, date});
  }
  persist();
  document.getElementById("amount").value="";
  document.getElementById("note").value="";
  document.querySelector('.tab[data-t="history"]').click();
};
document.getElementById("cancelEdit").onclick=()=>{
  editId=null; document.getElementById("cancelEdit").style.display="none";
  document.getElementById("save").textContent=t("btnSave");
  document.getElementById("amount").value=""; document.getElementById("note").value="";
};
function startEdit(id){
  const e = entries.find(x=>x.id===id); if(!e) return;
  type = e.type;
  document.getElementById(type==="income"?"btnIn":"btnEx").click();
  document.getElementById("amount").value = e.amt;
  document.getElementById("category").value = e.cat;
  document.getElementById("note").value = e.note;
  document.getElementById("date").value = e.date;
  editId = id;
  document.getElementById("cancelEdit").style.display="block";
  document.getElementById("save").textContent=t("btnUpdate");
  document.querySelector('.tab[data-t="add"]').click();
}

function monthEntries(){
  const my = ym(viewDate);
  return entries.filter(e=>e.date.slice(0,7)===my);
}

function renderStats(){
  const me = monthEntries();
  let inc=0, exp=0;
  me.forEach(e=> e.type==="income" ? inc+=e.amt : exp+=e.amt);
  document.getElementById("inVal").textContent = fmt(inc);
  document.getElementById("exVal").textContent = fmt(exp);
  document.getElementById("balVal").textContent = fmt(inc-exp);
  document.getElementById("mLabel").textContent = viewDate.toLocaleDateString(lang==="ta"?"ta-IN":"en-IN",{month:"long",year:"numeric"});
}

function renderDonut(){
  const me = monthEntries().filter(e=>e.type==="expense");
  const svg = document.getElementById("donut");
  const legend = document.getElementById("legend");
  if(!me.length){
    svg.innerHTML = `<circle cx="60" cy="60" r="50" fill="none" stroke="var(--chip)" stroke-width="16"/>`;
    legend.innerHTML = `<div style="color:var(--sub)">${t("emptyExpenseMonth")}</div>`;
    return;
  }
  const totals = {};
  me.forEach(e=> totals[e.cat] = (totals[e.cat]||0)+e.amt);
  const sorted = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const total = sorted.reduce((s,[,v])=>s+v,0);
  let acc = 0, paths = "";
  sorted.forEach(([cat,val],i)=>{
    const frac = val/total;
    const start = acc*2*Math.PI - Math.PI/2;
    acc += frac;
    const end = acc*2*Math.PI - Math.PI/2;
    const x1=60+50*Math.cos(start), y1=60+50*Math.sin(start);
    const x2=60+50*Math.cos(end), y2=60+50*Math.sin(end);
    const large = frac>0.5?1:0;
    paths += `<path d="M60,60 L${x1.toFixed(2)},${y1.toFixed(2)} A50,50 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${PALETTE[i%PALETTE.length]}"/>`;
  });
  svg.innerHTML = paths + `<circle cx="60" cy="60" r="28" fill="var(--card)"/>`;
  legend.innerHTML = sorted.slice(0,5).map(([cat,val],i)=>
    `<div><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(catLabel(cat))} · ${fmt(val)}</div>`).join("");
}

function renderRecent(){
  const box = document.getElementById("recentList");
  const list = monthEntries().slice(0,5);
  if(!list.length){ box.innerHTML=`<div class="empty">${t("emptyRecent")}</div>`; return; }
  box.innerHTML = list.map(entryRow).join("");
  bindRowActions(box);
}

function entryRow(e){
  return `<div class="entry">
    <div class="dot ${e.type==='income'?'in':'ex'}"></div>
    <div class="meta"><div class="cat">${esc(catLabel(e.cat))}</div><div class="note">${esc(e.date)}${e.note?" · "+esc(e.note):""}</div></div>
    <div class="amt ${e.type==='income'?'in':'ex'}">${e.type==='income'?'+':'-'}${fmt(e.amt)}</div>
    <div class="acts"><span class="editb" data-id="${e.id}">✎</span><span class="delb" data-id="${e.id}">✕</span></div>
  </div>`;
}
function bindRowActions(box){
  box.querySelectorAll(".editb").forEach(b=> b.onclick=()=>startEdit(Number(b.dataset.id)));
  box.querySelectorAll(".delb").forEach(b=> b.onclick=()=>{
    const idx=entries.findIndex(e=>e.id===Number(b.dataset.id)); if(idx<0) return;
    const [gone]=entries.splice(idx,1); persist(); renderAll();
    showToast(t("deleted"),()=>{ entries.splice(Math.min(idx,entries.length),0,gone); persist(); renderAll(); });
  });
}

function renderHistory(){
  const box = document.getElementById("historyList");
  const q = document.getElementById("search").value.trim().toLowerCase();
  const ft = document.getElementById("filterType").value;
  let list = entries.filter(e=>{
    if(ft!=="all" && e.type!==ft) return false;
    if(q && !(e.cat.toLowerCase().includes(q) || catLabel(e.cat).toLowerCase().includes(q) || e.note.toLowerCase().includes(q))) return false;
    return true;
  });
  if(!list.length){ box.innerHTML=`<div class="empty">${t("emptyHistory")}</div>`; return; }
  box.innerHTML = list.map(entryRow).join("");
  bindRowActions(box);
}
document.getElementById("search").oninput = renderHistory;
document.getElementById("filterType").onchange = renderHistory;

function loadBudgets(){ try{ return JSON.parse(localStorage.getItem("kanakku_budgets")||"{}"); }catch(e){ return {}; } }
function saveBudgets(b){ try{ localStorage.setItem("kanakku_budgets", JSON.stringify(b)); }catch(e){} }
function renderBudgets(){
  const box = document.getElementById("budgetsList");
  const budgets = loadBudgets();
  const me = monthEntries().filter(e=>e.type==="expense");
  const spent = {};
  me.forEach(e=> spent[e.cat]=(spent[e.cat]||0)+e.amt);
  box.innerHTML = CAT_KEYS.expense.map(cat=>{
    const b = budgets[cat]||0;
    const s = spent[cat]||0;
    const pct = b>0 ? Math.min(100,(s/b*100)) : 0;
    const overflow = b>0 && s>b;
    return `<div class="budgetrow">
      <div class="top"><span>${catLabel(cat)}</span><span class="${overflow?'over':''}">${fmt(s)} / <input type="number" class="bset" data-cat="${cat}" value="${b||''}" placeholder="${t('setPh')}" style="width:70px; padding:2px 4px; display:inline; font-size:.8rem"></span></div>
      <div class="bar"><i style="width:${pct}%; background:${overflow?'var(--expense)':'var(--accent)'}"></i></div>
    </div>`;
  }).join("");
  box.querySelectorAll(".bset").forEach(inp=>{
    inp.onchange=()=>{
      const bb = loadBudgets();
      bb[inp.dataset.cat] = parseFloat(inp.value)||0;
      saveBudgets(bb);
      renderBudgets();
    };
  });
}

function renderAll(){
  renderStats(); renderDonut(); renderRecent(); renderHistory(); renderBudgets(); renderLedger(); renderNudge();
}

document.getElementById("currencySym").oninput=(e)=>{
  cur = e.target.value || "₹";
  try{ localStorage.setItem("kanakku_currency", cur); }catch(err){}
  renderAll();
};

document.getElementById("exportCsv").onclick=()=>{
  const rows = [["Date","Type","Category","Amount","Note"]].concat(
    entries.map(e=>[e.date,e.type,e.cat,e.amt,e.note])
  );
  const csv = rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  downloadBlob(csv, "kanakku-export.csv", "text/csv");
};
document.getElementById("exportJson").onclick=()=>{
  downloadBlob(JSON.stringify({entries,budgets:loadBudgets(),ledger,exportedAt:new Date().toISOString()},null,2), "kanakku-backup.json", "application/json"); markBackup();
};
document.getElementById("emailBackup").onclick=async ()=>{
  const payload = JSON.stringify({ entries, budgets: loadBudgets(), ledger, exportedAt: new Date().toISOString() }, null, 2);
  const filename = `kanakku-backup-${today()}.json`;
  const file = new File([payload], filename, { type: "application/json" });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try{
      await navigator.share({ files: [file], title: "Kanakku Backup", text: t("emailShareText") });
      markBackup(); return;
    }catch(e){ /* user cancelled or share failed, fall through to download */ }
  }
  downloadBlob(payload, filename, "application/json");
  markBackup(); alert(t("emailFallback"));
};
function downloadBlob(content, filename, mime){
  const blob = new Blob([content],{type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
document.getElementById("importFile").onchange=(e)=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      const list = Array.isArray(data) ? data : (data && Array.isArray(data.entries) ? data.entries : null);
      if(list){
        entries = cleanEntries(list); persist(); if(Array.isArray(data.ledger)){ ledger=data.ledger.map(cleanLed).filter(Boolean); saveLedger(); }
        if(data.budgets && typeof data.budgets === "object" && !Array.isArray(data.budgets)) saveBudgets(data.budgets);
        renderAll(); alert(t("importOk"));
      } else { alert(t("importBad")); }
    }catch(err){ alert(t("importBad")); }
  };
  reader.readAsText(file);
};
document.getElementById("clearAll").onclick=()=>{
  if(confirm(t("eraseConfirm"))){
    entries = []; ledger = []; persist(); saveLedger(); saveBudgets({}); renderAll();
  }
};

document.getElementById("themeToggle").onclick=()=>{
  const curT = document.documentElement.getAttribute("data-theme");
  const next = curT === "dark" ? "light" : (curT === "light" ? "" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("kanakku_theme", next); }catch(e){}
};

// --- Daily reminder ---
function loadRem(){ try{ return JSON.parse(localStorage.getItem("kanakku_reminder")||'{"on":false,"time":"20:00"}'); }catch(e){ return {on:false,time:"20:00"}; } }
function saveRem(r){ try{ localStorage.setItem("kanakku_reminder", JSON.stringify(r)); }catch(e){} }
function setRemStatus(msg){ document.getElementById("remStatus").textContent = msg; }
function initReminderUI(){
  const r = loadRem();
  document.getElementById("remTime").value = r.time;
  toggleRemButtons(r.on);
  updateRemStatus();
}
function toggleRemButtons(on){
  document.getElementById("remOn").classList.toggle("on", on);
  document.getElementById("remOff").classList.toggle("on", !on);
}
function updateRemStatus(){
  const r = loadRem();
  if(!("Notification" in window)){ setRemStatus(t("remUnsupported")); return; }
  if(!r.on){ setRemStatus(t("remOffStatus")); return; }
  if(Notification.permission==="denied"){ setRemStatus(t("remBlocked")); return; }
  if(Notification.permission==="default"){ setRemStatus(t("remDefault")); return; }
  setRemStatus(t("remOnStatus")(r.time));
}
document.getElementById("remOn").onclick=async ()=>{
  if("Notification" in window && Notification.permission==="default"){
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ toggleRemButtons(false); updateRemStatus(); return; }
  }
  const r = loadRem(); r.on = true; r.time = document.getElementById("remTime").value; saveRem(r);
  toggleRemButtons(true); updateRemStatus();
};
document.getElementById("remOff").onclick=()=>{
  const r = loadRem(); r.on = false; saveRem(r);
  toggleRemButtons(false); updateRemStatus();
};
document.getElementById("remTime").onchange=()=>{
  const r = loadRem(); r.time = document.getElementById("remTime").value; saveRem(r);
  updateRemStatus();
};
function hasLoggedToday(){
  const today = today();
  return entries.some(e=>e.date===today);
}
function checkReminder(){
  const r = loadRem();
  if(!r.on || !("Notification" in window) || Notification.permission!=="granted") return;
  const now = new Date();
  const [hh,mm] = r.time.split(":").map(Number);
  const todayKey = today();
  const lastFired = localStorage.getItem("kanakku_rem_last") || "";
  const reachedTime = now.getHours()>hh || (now.getHours()===hh && now.getMinutes()>=mm);
  if(reachedTime && lastFired!==todayKey && !hasLoggedToday()){
    const opts={body:t("notifBody"),icon:"icon-192.png"};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(reg=>{ if(reg) reg.showNotification(t("notifTitle"),opts); else new Notification(t("notifTitle"),opts); });
    localStorage.setItem("kanakku_rem_last", todayKey);
  }
}
setInterval(checkReminder, 60000);

// init
load();
applyLang();
document.getElementById("date").value = today();
document.getElementById("currencySym").value = cur;
initReminderUI();
checkReminder();

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
